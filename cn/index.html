*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#050505;overflow:hidden;-webkit-tap-highlight-color:transparent}
body{font-family:'Bw Aleta',-apple-system,'Helvetica Neue',sans-serif;user-select:none;-webkit-user-select:none}
#stagewrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;overflow:hidden;background:#000;box-shadow:0 0 80px rgba(0,0,0,.9)}
.world{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
.world img.slide{position:absolute;top:0;left:0;width:1920px;height:1080px;display:block}
.world video{position:absolute;object-fit:fill;background:transparent;opacity:0;transition:opacity .22s ease}
.ov{position:absolute;white-space:pre;line-height:1.45;letter-spacing:.02em;z-index:4}
.page{position:absolute;inset:0;opacity:0;transition:opacity .24s ease}
.page.on{opacity:1}
#ui{position:fixed;inset:0;pointer-events:none;z-index:40}
.arr{position:fixed;top:50%;transform:translateY(-50%);width:56px;height:96px;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;opacity:.42;transition:opacity .2s}
.arr:hover{opacity:.95}
.arr svg{width:26px;height:46px;stroke:#fff;stroke-width:1.5;fill:none}
#prev{left:6px}#next{right:6px}
#counter{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);color:#9a9a9a;font-weight:300;font-size:12px;letter-spacing:.14em;pointer-events:none}
#ctrl{position:fixed;right:14px;bottom:10px;display:flex;gap:6px;pointer-events:auto}
.cbtn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.5;transition:opacity .2s}
.cbtn:hover{opacity:1}
.cbtn svg{width:17px;height:17px;stroke:#fff;stroke-width:1.4;fill:none}
.cbtn.lang{font:400 12px/1 'Bw Aleta',sans-serif;color:#fff;letter-spacing:.06em}
#sndbtn{display:none}
#sndbtn.muted svg .on{display:none}
#sndbtn:not(.muted) svg .off{display:none}
#grid{position:fixed;inset:0;background:rgba(6,6,6,.96);z-index:60;display:none;overflow-y:auto;padding:48px;pointer-events:auto}
#grid.on{display:block}
#grid .gwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;max-width:1500px;margin:0 auto}
#grid .cell{position:relative;cursor:pointer;opacity:.82;transition:opacity .15s,outline .15s;outline:1px solid transparent}
#grid .cell:hover{opacity:1}
#grid .cell.cur{outline:1px solid #E0C48E;opacity:1}
#grid img{width:100%;display:block}
#grid .num{position:absolute;right:5px;bottom:4px;font-size:10px;color:#ddd;letter-spacing:.08em;text-shadow:0 0 4px #000}
#loader{position:fixed;inset:0;background:#050505;z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:26px;transition:opacity .5s}
#loader.off{opacity:0;pointer-events:none}
#loader .word{color:#cfcfcf;font-weight:300;font-size:13px;letter-spacing:.42em;text-indent:.42em}
#lbar{width:180px;height:1px;background:#222;position:relative;overflow:hidden}
#lbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:#E0C48E;transition:width .3s}
@media (max-width:760px), (max-height:480px){
.arr{width:44px}.arr svg{width:20px;height:36px}
#counter{font-size:10px;bottom:12px}
.cbtn{width:42px;height:42px}.cbtn svg{width:16px;height:16px}
#ctrl{right:6px;bottom:6px;gap:2px}
#grid{padding:18px 12px}
#grid .gwrap{gap:8px;grid-template-columns:repeat(auto-fill,minmax(102px,1fr))}
}

function layout(){
  const vw = wrap.clientWidth, vh = wrap.clientHeight;
  let w = vw, h = vw*9/16;
  if(h > vh){ h = vh; w = vh*16/9; }
  stage.style.width = w+'px'; stage.style.height = h+'px';
  const s = w/1920;
  stage.querySelectorAll('.world').forEach(el => el.style.transform = `scale(${s})`);
}
addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 60));
if(window.ResizeObserver) new ResizeObserver(() => layout()).observe(wrap);

function overlayEl(o){
  const d = document.createElement('div');
  d.className = 'ov';
  const st = d.style;
  st.left = o.x+'px'; st.top = o.y+'px';
  if(o.t === 'jl'){
    const im = new Image(); im.src = '../assets/ui/jl.png';
    im.style.width = o.w+'px'; im.style.height = o.h+'px'; im.style.display='block';
    d.appendChild(im);
  } else if(o.t === 'label'){
    st.font = `${o.light?300:400} ${o.fs||20}px/1.3 "Bw Aleta"`; st.color = '#F2F2F2';
    d.textContent = o.text;
  } else if(o.t === 'patch'){
    st.width = o.w+'px'; st.height = o.h+'px'; st.background = o.c;
  } else if(o.t === 'hdr'){
    st.font = 'italic 400 27px/1.25 "Cormorant Garamond", Palatino, serif'; st.color = '#DADBDB';
    d.textContent = o.text;
  } else if(o.t === 'pal'){
    st.font = `italic 400 ${o.fs||20}px/1.35 Palatino, "Palatino Linotype", "Book Antiqua", serif`;
    st.color = '#D6D6D6';
    if(o.w){ st.width = o.w+'px'; }
    if(o.center){ st.textAlign = 'center'; }
    d.textContent = o.text;
  } else if(o.t === 'pageno'){
    st.font = 'italic 400 24px/1.3 Palatino, "Palatino Linotype", "Book Antiqua", serif'; st.color = '#D0D3D6';
    d.textContent = o.text;
  }
  return d;
}

function buildPage(n){
  const pg = document.createElement('div');
  pg.className = 'page';
  const w = document.createElement('div');
  w.className = 'world';
  pg.appendChild(w);
  const vids = vidsOf(n);
  const under = vids.some(v => v.under);
  const img = new Image();
  img.className = 'slide';
  img.src = under ? `assets/slides/s${pad(n)}o.png` + VER : slideURL(n);
  img.draggable = false;
  if(under) img.style.zIndex = 3;
  w.appendChild(img);
  for(const v of vids){
    const vid = document.createElement('video');
    vid.src = `../assets/video/${v.id}.mp4` + VER;
    vid.playsInline = true; vid.setAttribute('playsinline','');
    if(!v.sound) vid.setAttribute('muted','');
    vid.preload = 'auto';
    vid.loop = v.loop;
    vid.muted = !v.sound;
    vid.style.left = v.x+'px'; vid.style.top = v.y+'px';
    vid.style.width = v.w+'px'; vid.style.height = v.h+'px';
    vid.style.zIndex = v.under ? 1 : 2;
    vid.style.objectFit = v.fit || 'fill';
    if(v.clip) vid.style.clipPath = `inset(${v.clip[0]}px ${v.clip[1]}px ${v.clip[2]}px ${v.clip[3]}px)`;
    vid.dataset.op = v.op; vid.dataset.sound = v.sound?1:0;
    vid.addEventListener('playing', () => { vid.style.opacity = v.op; }, {once:true});
    vid.addEventListener('contextmenu', e => e.preventDefault());
    w.appendChild(vid);
  }
  for(const o of (CFG.overlays[n]||[])) w.appendChild(overlayEl(o));
  return pg;
}

const sndbtn = $('#sndbtn');
function updateSound(){
  const sv = curVids.filter(v => v.dataset.sound === '1');
  if(!sv.length){ sndbtn.style.display = 'none'; return; }
  sndbtn.style.display = 'flex';
  sndbtn.classList.toggle('muted', sv.every(v => v.muted));
}
sndbtn.addEventListener('click', () => {
  const sv = curVids.filter(v => v.dataset.sound === '1');
  const un = sv.every(v => v.muted);
  sv.forEach(v => { v.muted = !un ? true : false; if(un){ v.volume = 1; } });
  updateSound();
});

function show(n){
  n = Math.max(1, Math.min(CFG.n, n));
  const old = world;
  cur = n;
  world = buildPage(n);
  stage.appendChild(world);
  layout();
  void world.offsetWidth;   // force reflow so the fade-in transition runs
  world.classList.add('on');
  if(old){ old.classList.remove('on'); setTimeout(() => old.remove(), 320); }
  curVids = [...world.querySelectorAll('video')];
  curVids.forEach(v => {
    const p = v.play();
    if(p) p.catch(() => { v.muted = true; v.play().catch(()=>{}); updateSound(); });
  });
  updateSound();
  $('#counter').textContent = `${n} / ${CFG.n}`;
  history.replaceState(null, '', '#'+n);
  [n-1, n+1, n+2].forEach(m => { if(m>=1 && m<=CFG.n){ (new Image()).src = slideURL(m); } });
  document.querySelectorAll('#grid .cell').forEach((c,i) => c.classList.toggle('cur', i+1===n));
}
const step = d => { if(!$('#grid').classList.contains('on')) show(cur+d); };
$('#prev').addEventListener('click', () => step(-1));
$('#next').addEventListener('click', () => step(1));
addEventListener('keydown', e => {
  if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown'){ e.preventDefault(); step(1); }
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); step(-1); }
  else if(e.key === 'Home'){ show(1); }
  else if(e.key === 'End'){ show(CFG.n); }
  else if(e.key === 'g' || e.key === 'G'){ toggleGrid(); }
  else if(e.key === 'f' || e.key === 'F'){ toggleFS(); }
  else if(e.key === 'Escape'){ $('#grid').classList.remove('on'); }
});
let tx = null, ty = null;
addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
addEventListener('touchend', e => {
  if(tx === null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) > 44 && Math.abs(dx) > Math.abs(dy)*1.4) step(dx < 0 ? 1 : -1);
  tx = null;
}, {passive:true});

const grid = $('#grid'), gwrap = grid.querySelector('.gwrap');
let gridBuilt = false;
function toggleGrid(){
  if(!gridBuilt){
    for(let i=1;i<=CFG.n;i++){
      const c = document.createElement('div');
      c.className = 'cell' + (i===cur?' cur':'');
      const im = new Image(); im.src = thumbURL(i); im.loading = 'lazy'; im.draggable = false;
      const num = document.createElement('div'); num.className = 'num'; num.textContent = i;
      c.appendChild(im); c.appendChild(num);
      c.addEventListener('click', () => { grid.classList.remove('on'); show(i); });
      gwrap.appendChild(c);
    }
    gridBuilt = true;
  }
  grid.classList.toggle('on');
}
$('#gridbtn').addEventListener('click', toggleGrid);
function toggleFS(){
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
}
$('#fsbtn').addEventListener('click', toggleFS);
$('#langbtn').addEventListener('click', () => { location.href = '../' + '#' + cur; });

document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible')
    curVids.forEach(v => { if(v.paused && !v.ended) v.play().catch(()=>{}); });
});

const start = parseInt(location.hash.slice(1)) || 1;
const pre = new Image();
pre.onload = () => { $('#lbar i').style.width='100%'; setTimeout(() => { $('#loader').classList.add('off'); }, 250); };
pre.onerror = pre.onload;
$('#lbar i').style.width = '55%';
pre.src = slideURL(start);
show(start);
</script>
</body>
</html>
